services:
  registry:
    build: .
    image: pm-agents:latest
    container_name: pm-registry
    command: uvicorn agents.registry.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  vibration-agent:
    build: .
    image: pm-agents:latest
    container_name: pm-vibration-agent
    command: uvicorn agents.vibration_agent.main:app --host 0.0.0.0 --port 8002
    environment:
      REGISTRY_URL: http://registry:8000
      SELF_URL: http://vibration-agent:8002
    ports:
      - "8002:8002"
    depends_on:
      registry:
        condition: service_healthy

  thermal-agent:
    build: .
    image: pm-agents:latest
    container_name: pm-thermal-agent
    command: uvicorn agents.thermal_agent.main:app --host 0.0.0.0 --port 8003
    environment:
      REGISTRY_URL: http://registry:8000
      SELF_URL: http://thermal-agent:8003
    ports:
      - "8003:8003"
    depends_on:
      registry:
        condition: service_healthy

  maintenance-agent:
    build: .
    image: pm-agents:latest
    container_name: pm-maintenance-agent
    command: uvicorn agents.maintenance_agent.main:app --host 0.0.0.0 --port 8004
    environment:
      REGISTRY_URL: http://registry:8000
      SELF_URL: http://maintenance-agent:8004
    ports:
      - "8004:8004"
    depends_on:
      registry:
        condition: service_healthy

  orchestrator:
    build: .
    image: pm-agents:latest
    container_name: pm-orchestrator
    command: uvicorn agents.orchestrator.main:app --host 0.0.0.0 --port 8001
    environment:
      REGISTRY_URL: http://registry:8000
      SELF_URL: http://orchestrator:8001
    ports:
      - "8001:8001"
    depends_on:
      registry:
        condition: service_healthy
      vibration-agent:
        condition: service_started
      thermal-agent:
        condition: service_started
      maintenance-agent:
        condition: service_started
